name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Icarus Verilog
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/requirements.txt

      - name: Install pinned Python packages
        run: python -m pip install --requirement test/requirements.txt

      - name: Lint and run RTL smoke test
        working-directory: test
        shell: bash
        run: |
          set -euo pipefail
          python ../scripts/validate_project.py
          make lint
          make clean
          make
          ! grep -E '<(failure|error)' results.xml

      - name: Publish test summary
        uses: test-summary/action@v2.4
        if: always()
        with:
          paths: test/results.xml

      - name: Upload waveform and test results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
          if-no-files-found: ignore
